name: ios
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Swift core
        shell: bash
        working-directory: ios
        run: |
          swift build > build.log 2>&1 || { grep -E "error" build.log | sort -u | head -40; exit 1; }
          echo "core builds"
      - name: Tests (core logic, database, importer)
        shell: bash
        working-directory: ios
        run: |
          swift test > test.log 2>&1 || { grep -E "error:|failed|XCTAssert" test.log | sort -u | head -80; exit 1; }
          grep -E "Executed" test.log | tail -2
  app:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project and fetch VLC
        shell: bash
        working-directory: ios
        run: |
          brew install xcodegen > brew.log 2>&1 || { tail -20 brew.log; exit 1; }
          xcodegen generate
          pod install > pod.log 2>&1 || { tail -40 pod.log; exit 1; }
          tail -3 pod.log
      - name: Build the unsigned .ipa for iPhone and iPad
        shell: bash
        working-directory: ios
        run: |
          xcodebuild -workspace Topplayer.xcworkspace -scheme Topplayer -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > dev.log 2>&1 \
            || { grep -E "error:" dev.log | sort -u | head -60; tail -15 dev.log; exit 1; }
          rm -rf Payload && mkdir Payload && cp -R build-dev/Build/Products/Release-iphoneos/Topplayer.app Payload/
          zip -qr Topplayer-iOS-unsigned.ipa Payload
          ls -la Topplayer-iOS-unsigned.ipa
      - name: Publish the .ipa as a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUM=$(shasum -a 256 ios/Topplayer-iOS-unsigned.ipa | cut -d' ' -f1)
          NOTES="Unsigned build for iPhone and iPad, from commit ${GITHUB_SHA::7}. SHA256: $SUM"
          gh release view ios-latest > /dev/null 2>&1 || gh release create ios-latest --prerelease --target "${GITHUB_SHA}" --title "iPhone en iPad (laatste build)" --notes "$NOTES"
          gh release edit ios-latest --notes "$NOTES" --target "${GITHUB_SHA}"
          gh release upload ios-latest ios/Topplayer-iOS-unsigned.ipa --clobber
          gh release view ios-latest --json assets --jq '.assets[] | .name + " " + (.size|tostring)'
