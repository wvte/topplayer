name: Topplayer
options:
  bundleIdPrefix: com.topplayer
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
  createIntermediateGroups: true
packages:
  TopplayerCore:
    path: .
targets:
  Topplayer:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources"]
      - path: App/Resources/ui
        type: folder
      - path: App/Resources/demo.m3u
    dependencies:
      - package: TopplayerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.topplayer.ios
        MARKETING_VERSION: "1.0.10"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Topplayer
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
  # The Mac app: the same bridge, players and interface (TV layout, keyboard and mouse), its own window and menus.
  TopplayerMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Resources", "Assets.xcassets"]
      - path: Mac
      - path: App/Resources/ui
        type: folder
      - path: App/Resources/demo.m3u
    dependencies:
      - package: TopplayerCore
    settings:
      base:
        PRODUCT_NAME: Topplayer
        PRODUCT_BUNDLE_IDENTIFIER: com.topplayer.mac
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Mac/Info.plist
      properties:
        CFBundleName: Topplayer
        CFBundleDisplayName: Topplayer
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "12.0"
        NSHumanReadableCopyright: "Topplayer. Video: AVFoundation en VLCKit (LGPL 2.1)."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        NSLocalNetworkUsageDescription: "Topplayer speelt zenders en films af van de server uit je playlist, ook als die in je eigen netwerk staat."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
